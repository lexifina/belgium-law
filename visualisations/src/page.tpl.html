<script>

const D = DATA.charts, PF = DATA.profile;
const LANGS = ['nl', 'fr', 'en'];
let LANG = 'nl';
try { const q = new URLSearchParams(location.search).get('lang'); if (LANGS.includes(q)) LANG = q; else { const s = localStorage.getItem('be-viz-lang'); if (LANGS.includes(s)) LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const tt = localStorage.getItem('be-viz-theme'); if (tt === 'light' || tt === 'dark') THEME = tt; } catch (e) {}

// ------------------------------------------------------------------ strings
const GL = '<a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>';
const S = {
nl: {
  title: 'Belgisch recht in 20 grafieken',
  lede: 'Twintig grafieken, uitsluitend getekend uit de gegevens van deze repository: de Grondwet en 23 wetboeken en wetten met elke versie uit Justel en de akten die ze wijzigden, 753 akten van 2025 van de acht Belgische wetgevers, de federale wetten van 2026, het nieuwe Strafwetboek, en uitspraken van het Hof van Cassatie, de Raad van State en het Grondwettelijk Hof.',
  profile_h: 'Gegevensprofiel: wat werd gebruikt en hoe volledig het is',
  tbl: 'Tabel met de gegevens', src: 'Bron in de repository', n: 'Records', cover: 'Dekking', caveat: 'Beperking',
  ds: 'Gegevens', foot: 'Gebouwd uit de repository lexifina/belgium-law ({built}). De getallen berekent visualisations/src/prep.py uit de git-geschiedenis, de teksten en de tabellen in data/; build.py zet de pagina in elkaar. Alle grafieken zijn beschrijvend: ze tonen wat de bronnen vastleggen, niet waarom.',
  tiles: ['commits in de geschiedenis', 'versies van de wetboeken en wetten', 'wijzigende akten in data/laws.csv', 'akten van 2025', 'federale wetten van 2026', 'rechterlijke beslissingen'],
  year: 'Jaar', total: 'Totaal', share: 'Aandeel', count: 'Aantal', partial: 'onvolledig', days: 'dagen',
  gl: 'Grafieken over het recht van alle landen, uit heel global-law: ' + GL + '. Hier staan alleen de grafieken over België.',
},
fr: {
  title: 'Le droit belge en 20 graphiques',
  lede: 'Vingt graphiques tirés uniquement des données de ce dépôt : la Constitution et 23 codes et lois avec chacune de leurs versions issues de Justel et les actes qui les ont modifiés, 753 actes de 2025 des huit législateurs belges, les lois fédérales de 2026, le nouveau Code pénal, et des décisions de la Cour de cassation, du Conseil d’État et de la Cour constitutionnelle.',
  profile_h: 'Profil des données : ce qui a été utilisé et dans quelle mesure c’est complet',
  tbl: 'Tableau des données', src: 'Source dans le dépôt', n: 'Enregistrements', cover: 'Couverture', caveat: 'Limite',
  ds: 'Données', foot: 'Construit à partir du dépôt lexifina/belgium-law ({built}). Les chiffres sont calculés par visualisations/src/prep.py à partir de l’historique git, des textes et des tableaux de data/ ; build.py assemble la page. Tous les graphiques sont descriptifs : ils montrent ce que les sources enregistrent, pas pourquoi.',
  tiles: ['commits dans l’historique', 'versions des codes et lois', 'actes modificatifs dans data/laws.csv', 'actes de 2025', 'lois fédérales de 2026', 'décisions de justice'],
  year: 'Année', total: 'Total', share: 'Part', count: 'Nombre', partial: 'incomplet', days: 'jours',
  gl: 'Des graphiques sur le droit de tous les pays, tirés de l’ensemble de global-law : ' + GL + '. Ici figurent uniquement les graphiques sur la Belgique.',
},
en: {
  title: 'Belgian law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the Constitution and 23 codes and laws with every version from Justel and the acts that changed them, 753 acts of 2025 from Belgium’s eight lawmakers, the federal laws of 2026, the new Criminal Code, and decisions of the Court of Cassation, the Council of State and the Constitutional Court.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/belgium-law repository ({built}). The numbers are computed by visualisations/src/prep.py from the git history, the texts and the tables in data/; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  tiles: ['commits in the history', 'versions of the codes and laws', 'amending acts in data/laws.csv', 'acts of 2025', 'federal laws of 2026', 'court decisions'],
  year: 'Year', total: 'Total', share: 'Share', count: 'Count', partial: 'partial', days: 'days',
  gl: 'Charts on every country’s law, from the whole of global-law: ' + GL + '. These are the charts on Belgium alone.',
}};
// French: a narrow no-break space before : ; ! ? » and after «, so the sign never starts a line.
const FRP = s => typeof s === 'string' ? s.replace(/ ([:;!?»])/g, ' $1').replace(/« /g, '« ') : s;
const t = k => LANG === 'fr' ? FRP(S.fr[k]) : S[LANG][k];
const L = (nl, fr, en) => LANG === 'nl' ? nl : LANG === 'fr' ? FRP(fr) : en;
const LA = a => Array.isArray(a) ? L(a[0], a[1], a[2]) : a;
// Dutch: a dot between thousands and a decimal comma; French: a narrow no-break space and a decimal comma; English: en-GB.
// A no-break space before % in Dutch and French (a narrow one in French), none in English.
const NB = ' ', NNB = ' ';
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'nl' ? '.' : LANG === 'fr' ? NNB : ',');
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d); const [a, b] = s.split('.'); return (+v < 0 && +s !== 0 ? '−' : '') + grp(a) + (b ? (LANG === 'en' ? '.' : ',') + b : ''); };
const fmt = n => (n == null ? '–' : Number.isInteger(+n) ? (+n < 0 ? '−' : '') + grp(String(Math.abs(Math.round(+n)))) : dec(+n, 1));
const pv = (v, d = 0) => dec(v, d) + (LANG === 'en' ? '%' : LANG === 'fr' ? NNB + '%' : NB + '%');
const pct = (a, b, d = 0) => b ? pv(100 * a / b, d) : '–';
const MNL = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
const MFR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = { nl: ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'], fr: ['jan', 'fév', 'mar', 'avr', 'mai', 'juin', 'juil', 'août', 'sep', 'oct', 'nov', 'déc'],
  en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const MSH = { nl: ['jan.', 'feb.', 'mrt.', 'apr.', 'mei', 'jun.', 'jul.', 'aug.', 'sep.', 'okt.', 'nov.', 'dec.'], fr: ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'], en: MON.en };
const monthName = m => L(MNL, MFR, MEN)[m - 1];
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'fr' ? `${d === 1 ? '1er' : d} ${MFR[m - 1]} ${y}` : LANG === 'nl' ? `${d} ${MNL[m - 1]} ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'fr' ? `${d === 1 ? '1er' : d} ${MSH.fr[m - 1]} ${y}` : `${d} ${MSH[LANG][m - 1]} ${y}`; };
const dayMonth = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'fr' ? `${d === 1 ? '1er' : d} ${MFR[m - 1]}` : LANG === 'nl' ? `${d} ${MNL[m - 1]}` : `${d} ${MEN[m - 1]}`; };
const monthYear = s => { const [y, m] = s.split('-').map(Number); return `${Cap(monthName(m))} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const PD = s => d3.timeParse('%Y-%m-%d')(s);
const DAYS = (a, b) => Math.round((PD(b) - PD(a)) / 864e5);
const Cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const span = (a, b) => `${a}–${b}`;
// nouns after a number, by language: n(5, ['wet', 'wetten'], ['loi', 'lois'], ['law', 'laws'])
const nn = (n, nl, fr, en) => { const w = L(nl, fr, en); return `${fmt(n)} ${n === 1 ? w[0] : w[1]}`; };
// "a, b en c" / "a, b et c" / "a, b and c"
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + L(' en ', ' et ', ' and ') + a[a.length - 1];

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');

part('p2', 'II. Het federale parlement', 'II. Le Parlement fédéral', 'II. The federal Parliament',
  'De federale wetten in deze repository: welke kamers ze behandelen en wat ze regelen, en voor de wetten die de wetboeken wijzigden: wanneer ze werden afgekondigd, hoe snel ze in het Staatsblad verschenen en ingingen, en hoe vaak een wijziging terugwerkt.',

  'The federal laws in this repository: which chambers deal with them and what they do, and for the laws that changed the codes: when they were enacted, how fast they appeared in the Moniteur and took effect, and how often a change is retroactive.');

const K7 = { amend: ['Wijziging van andere wetten', 'Modification d’autres lois', 'Amending other laws'], omnibus: ['Diverse bepalingen, programma- en kaderwetten', 'Dispositions diverses, lois-programmes, lois-cadres', 'Miscellaneous provisions, programme and framework laws'],

const PROC = ['74', '78', '77', 'none'];

  L('artikel 77: Kamer en Senaat gelijk', 'article 77 : Chambre et Sénat sur un pied d’égalité', 'article 77: Chamber and Senate equally'), L('herziening van de Grondwet', 'révision de la Constitution', 'revision of the Constitution')];
const my = s => { const [y, m] = s.split('-').map(Number); return `${monthName(m)} ${y}`; };
chart('c07', el => {

      `Chambre et Sénat : ${pct(n74, n)} des ${fmt(n)} lois fédérales d’${my(first)} à ${my(last)} règlent une matière que la Chambre traite sans le Sénat (article 74)`,
      `Chamber and Senate: ${pct(n74, n)} of the ${fmt(n)} federal laws from ${my(first)} to ${my(last)} deal with a matter the Chamber handles without the Senate (article 74)`),
    dek: L(`Artikel 1 van elke wet zegt welk artikel van de Grondwet haar procedure bepaalt: artikel 74 (de Koning en de Kamer van volksvertegenwoordigers), artikel 78 (de Senaat kan het ontwerp onderzoeken en amenderen) of artikel 77 (Kamer en Senaat op voet van gelijkheid). ${fmt(n78)} wetten vallen onder artikel 78, ${fmt(n77)} onder artikel 77, waaronder de ${fmt(spec)} bijzondere wetten. De herziening van artikel 195 van 15 juli 2026 laat de Kamers die na 9 juni 2024 zijn samengesteld onder meer toe artikel 74 op te heffen en artikel 36 zo te herzien dat de federale wetgevende macht bestaat uit de Kamer van volksvertegenwoordigers en de Koning.`,
      `L’article 1er de chaque loi dit quel article de la Constitution régit sa procédure : l’article 74 (le Roi et la Chambre des représentants), l’article 78 (le Sénat peut examiner et amender le projet) ou l’article 77 (Chambre et Sénat sur un pied d’égalité). ${fmt(n78)} lois relèvent de l’article 78, ${fmt(n77)} de l’article 77, dont les ${fmt(spec)} lois spéciales. La révision de l’article 195 du 15 juillet 2026 permet notamment aux Chambres constituées après le 9 juin 2024 d’abroger l’article 74 et de réviser l’article 36 pour que le pouvoir législatif fédéral se compose de la Chambre des représentants et du Roi.`,
      `Article 1 of every law says which article of the Constitution governs its procedure: article 74 (the King and the Chamber of Representatives), article 78 (the Senate may examine and amend the bill) or article 77 (Chamber and Senate on an equal footing). ${fmt(n78)} laws fall under article 78, ${fmt(n77)} under article 77, among them the ${fmt(spec)} special laws. The revision of article 195 of 15 July 2026 allows the Chambers formed after 9 June 2024, among other things, to repeal article 74 and to revise article 36 so that the federal legislative power consists of the Chamber of Representatives and the King.`),

        .filter(r => sum(PROC, p => r[p])).sort((a, b) => sum(PROC, p => b[p]) - sum(PROC, p => a[p]));

        L('de procedure staat in artikel 1 (« La présente loi règle une matière visée à l’article 74 de la Constitution »); de soort wet wordt uit de titel gelezen, de eerste regel die past (regels in src/prep.py); de woorden die alleen de gewijzigde wet noemen, tellen niet. Artikelen: het aantal bepalingen dat Justel voor elke wet geeft. De wetten van 2025 in deze repository dateren van oktober–december 2025.',
          'la procédure figure à l’article 1er (« La présente loi règle une matière visée à l’article 74 de la Constitution ») ; le type de loi est lu dans l’intitulé, première règle applicable (règles dans src/prep.py) ; les mots qui ne font que nommer la loi modifiée ne comptent pas. Articles : le nombre de dispositions que Justel donne pour chaque loi. Les lois de 2025 de ce dépôt datent d’octobre à décembre 2025.',
          'the procedure is in article 1 ("La présente loi règle une matière visée à l’article 74 de la Constitution"); the kind of law is read from the title, the first rule that fits (rules in src/prep.py); words that only name the amended law do not count. Articles: the number of provisions Justel gives for each law. The laws of 2025 in this repository date from October–December 2025.'));
      table(el, [L('Datum', 'Date', 'Date'), L('Wet (Franse titel)', 'Loi', 'Law (French title)'), L('Procedure', 'Procédure', 'Procedure'), L('Soort', 'Type', 'Kind'), L('Artikelen', 'Articles', 'Articles')],
        Ls.map(x => [x.made, x.t.replace(/^.*?\d{4}\s*\.?\s*-\s*/, '').slice(0, 140), x.proc === 'none' ? '–' : L('art. ', 'art. ', 'art. ') + x.proc, LA(K7[x.k]), x.prov == null ? '–' : x.prov]));
    }

    dek: L(`De Raad van State nummert zijn arresten doorlopend. Uit de nummers van de ${fmt(c.rows.length)} arresten in deze repository, van nr. ${fmt(c.first[1])} (${dateTxt(c.first[0])}) tot nr. ${fmt(c.last[1])} (${dateTxt(c.last[0])}), volgt hoeveel arresten er elke maand bijkwamen (lichte kolom); de donkere kolom zijn de arresten die de repository zelf bevat, het percentage hun aandeel. Volgens de teksten in de repository schrijven de kamers ${andList(ord(fr))} in het Frans en ${andList(ord(nl))} in het Nederlands.`,
      `Le Conseil d’État numérote ses arrêts en continu. Les numéros des ${fmt(c.rows.length)} arrêts de ce dépôt, du n° ${fmt(c.first[1])} (${dateTxt(c.first[0])}) au n° ${fmt(c.last[1])} (${dateTxt(c.last[0])}), montrent combien d’arrêts s’ajoutaient chaque mois (colonne claire) ; la colonne foncée est celle des arrêts que le dépôt contient, le pourcentage leur part. D’après les textes du dépôt, les chambres ${andList(ord(fr))} statuent en français et ${andList(ord(nl))} en néerlandais.`,
      `The Council of State numbers its judgments in one series. The numbers of the ${fmt(c.rows.length)} judgments in this repository, from No. ${fmt(c.first[1])} (${dateTxt(c.first[0])}) to No. ${fmt(c.last[1])} (${dateTxt(c.last[0])}), show how many judgments were added each month (light column); the dark column is the judgments the repository holds, the percentage their share. By the texts in the repository, chambers ${andList(ord(fr))} rule in French and ${andList(ord(nl))} in Dutch.`),
    draw(el) {
      const ink = css('--s6');
      legend(el, [{ c: ink + '38', l: L('arresten volgens de nummering', 'arrêts selon la numérotation', 'judgments by the numbering') }, { c: ink, l: L('arresten in de repository', 'arrêts dans le dépôt', 'judgments in the repository') }]);
      const w = W(el), nw = narrow(w), h = nw ? 230 : 260, m = { t: 20, r: 4, b: 30, l: 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(M.map(q => q.m)).range([0, iw]).padding(0.18), y = d3.scaleLinear().domain([0, d3.max(M, q => q.est || 0)]).nice().range([ih, 0]);
      yAxis(g, y, iw, 4);
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      M.forEach((q, i) => {
        const bx = x(q.m), bw = x.bandwidth(), op = q.partial ? .5 : 1;
        if (q.est != null) g.append('path').attr('d', colPath(bx, ih, bw, y(q.est), Math.min(4, bw / 3))).attr('fill', ink).attr('fill-opacity', .22 * op);
        g.append('path').attr('d', colPath(bx, ih, bw, y(q.held), Math.min(4, bw / 3))).attr('fill', ink).attr('opacity', op);
        if (q.est && (!nw || i % 2 === 0)) g.append('text').attr('class', 'lbl').attr('x', bx + bw / 2).attr('y', y(q.est) - 5).attr('text-anchor', 'middle').style('font-size', nw ? '9px' : '10px').text(pct(q.held, q.est));
        const [yy, mm] = q.m.split('-').map(Number);
        if (!nw || mm % 3 === 1) g.append('text').attr('class', 'lbl').attr('x', bx + bw / 2).attr('y', ih + 14).attr('text-anchor', 'middle').style('font-size', nw ? '9px' : '10px').text(MON[LANG][mm - 1]);
        if (mm === 1 || i === 0) g.append('text').attr('class', 'lbl strong').attr('x', bx + (nw ? bw / 2 : 0)).attr('y', ih + 27).attr('text-anchor', nw ? 'middle' : 'start').style('font-size', '10px').text(yy);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', bx - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih).datum(q),
          d => `<b>${monthYear(d.m)}${d.partial ? ' (' + L('tot 25 juni', 'jusqu’au 25 juin', 'to 25 June') + ')' : ''}</b>` + trow(ink + '55', L('Arresten volgens de nummering', 'Arrêts selon la numérotation', 'Judgments by the numbering'), d.est == null ? '–' : '≈ ' + fmt(d.est)) + trow(ink, L('In de repository', 'Dans le dépôt', 'In the repository'), fmt(d.held)) + trow(null, t('share'), d.est ? pct(d.held, d.est) : '–'));
      });
      // the chambers, by the language of their texts
      h4(el, L('De arresten in de repository per kamer', 'Les arrêts du dépôt par chambre', 'The judgments in the repository by chamber'), 12);
      const ch = Object.entries(c.by_ch).filter(([k]) => k).sort((a, b) => roman.indexOf(a[0]) - roman.indexOf(b[0])), cfr = css('--s1'), cnl = css('--s4');
      legend(el, [{ c: cfr, l: L('kamer die in het Frans schrijft', 'chambre statuant en français', 'chamber ruling in French') }, { c: cnl, l: L('kamer die in het Nederlands schrijft', 'chambre statuant en néerlandais', 'chamber ruling in Dutch') }]);
      splitBars(el, ch.map(([k, n]) => ({ k, fr: lc[k] === 'fr' ? n : 0, nl: lc[k] === 'nl' ? n : 0, other: lc[k] ? 0 : n })), ['fr', 'nl', 'other'], [cfr, cnl, css('--muted-mark')],
        [L('Frans', 'Français', 'French'), L('Nederlands', 'Néerlandais', 'Dutch'), L('taal onbekend', 'langue inconnue', 'language unknown')], { rowH: 22, l: 120, ln: 90, rr: 60, label: r => L(`Kamer ${r.k}`, `Chambre ${r.k}`, `Chamber ${r.k}`) });
      note(el, ['caselaw/conseil-etat/<YEAR>/arrets-<NUMBER>/<NUMBER>/source.json (number, decision_date, chamber)', 'decision.txt'], fmt(c.rows.length) + L(' arresten', ' arrêts', ' judgments'),
        L(`het aantal per maand is het verschil tussen de nummers aan het begin en het einde van de maand, lineair geïnterpoleerd tussen de dichtstbijzijnde arresten in de repository (één record, nr. 60.959 van 11 juni 1996, volgt de nummering niet en telt niet mee). Juni 1996 loopt tot 25 juni (lichter). De taal van een kamer is die van de meeste van haar ${fmt(c.texts)} teksten in de repository; de andere arresten bevatten alleen gegevens.`,
          `le nombre par mois est la différence entre les numéros de début et de fin de mois, interpolés linéairement entre les arrêts les plus proches du dépôt (un enregistrement, le n° 60.959 du 11 juin 1996, ne suit pas la numérotation et ne compte pas). Juin 1996 va jusqu’au 25 juin (plus clair). La langue d’une chambre est celle de la plupart de ses ${fmt(c.texts)} textes dans le dépôt ; les autres arrêts ne contiennent que des métadonnées.`,
          `the number a month is the difference between the numbers at the start and the end of the month, interpolated linearly between the nearest judgments in the repository (one record, No. 60.959 of 11 June 1996, does not follow the numbering and is left out). June 1996 runs to 25 June (lighter). A chamber’s language is that of most of its ${fmt(c.texts)} texts in the repository; the other judgments hold only metadata.`));
      table(el, [L('Maand', 'Mois', 'Month'), L('Volgens de nummering', 'Selon la numérotation', 'By the numbering'), L('In de repository', 'Dans le dépôt', 'In the repository'), t('share')], M.map(q => [q.m, q.est == null ? '–' : q.est, q.held, q.est ? pct(q.held, q.est) : '–']));
    }
  };
});

/*CHARTS*/

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'c05', 'c06', 'p2', 'c07', 'c08', 'c09', 'c10', 'p3', 'c11', 'c12', 'c13', 'c14', 'c15', 'c16', 'p4', 'c17', 'c18', 'c19', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Git-geschiedenis (elke commit)', 'Historique git (chaque commit)', 'Git history (every commit)'), 'git log origin/main', fmt(P.commits), L(`elke versie op de dag van inwerkingtreding, ${P.first_in_force.slice(0, 4)}–${P.last_in_force.slice(0, 4)}`, `chaque version au jour de son entrée en vigueur, ${P.first_in_force.slice(0, 4)}–${P.last_in_force.slice(0, 4)}`, `every version on the day it took effect, ${P.first_in_force.slice(0, 4)}–${P.last_in_force.slice(0, 4)}`), L('de akten van 2025, de wetten van 2026 en de rechtspraak zijn later toegevoegd', 'les actes de 2025, les lois de 2026 et la jurisprudence ont été ajoutés ensuite', 'the acts of 2025, the laws of 2026 and the case law were added later')],
    [L('Grondwet, wetboeken en wetten (Justel)', 'Constitution, codes et lois (Justel)', 'Constitution, codes and laws (Justel)'), 'constitution/ code-judiciaire/ code-penal/ …', L(`${fmt(P.versions)} versies van ${fmt(P.acts29)} teksten`, `${fmt(P.versions)} versions de ${fmt(P.acts29)} textes`, `${fmt(P.versions)} versions of ${fmt(P.acts29)} texts`), L('24 Franse teksten (1981–2026) en 5 Nederlandse', '24 textes français (1981–2026) et 5 néerlandais', '24 French texts (1981–2026) and 5 Dutch ones'), L('de meeste beginnen bij de oudste tekst in het archief van Justel, niet zoals aangenomen', 'la plupart commencent au plus ancien texte archivé par Justel, pas tel qu’adopté', 'most start with the oldest text in Justel’s archive, not as enacted')],
    [L('Wijzigende akten', 'Actes modificatifs', 'Amending acts'), 'data/laws.csv', fmt(P.laws_csv), L(`${fmt(P.laws_csv_laws)} wetten, de rest koninklijke besluiten, decreten, ordonnanties en arresten`, `${fmt(P.laws_csv_laws)} lois, le reste arrêtés royaux, décrets, ordonnances et arrêts`, `${fmt(P.laws_csv_laws)} laws, the rest royal decrees, decrees, ordinances and rulings`), L('alleen de akten die deze 24 teksten wijzigden', 'uniquement les actes qui ont modifié ces 24 textes', 'only the acts that changed these 24 texts')],
    [L('Akten van 2025', 'Actes de 2025', 'Acts of 2025'), 'arrete/ decret/ loi/ ordonnance/ reglement/ norm/ …', fmt(P.acts2025), L('ondertekend in 2025, de meeste in oktober–december', 'signés en 2025, la plupart en octobre–décembre', 'signed in 2025, most in October–December'), L('een selectie uit de lijsten van Justel, geen volledige jaargang', 'une sélection dans les listes de Justel, pas une année complète', 'a selection from Justel’s lists, not a complete year')],
    [L('Federale wetten van 2026', 'Lois fédérales de 2026', 'Federal laws of 2026'), 'loi-2026…/', fmt(P.laws2026), L('januari–oktober 2026', 'janvier–octobre 2026', 'January–October 2026'), L('huidige Franse tekst', 'texte français actuel', 'current French text')],
    [L('Nieuw Strafwetboek', 'Nouveau Code pénal', 'New Criminal Code'), 'code-penal-2024/', L(`${fmt(P.penal2024)} artikelen`, `${fmt(P.penal2024)} articles`, `${fmt(P.penal2024)} articles`), L('in werking sinds 1 september 2026', 'en vigueur depuis le 1er septembre 2026', 'in force since 1 September 2026'), L('één versie', 'une seule version', 'one version')],
    [L('Hof van Cassatie', 'Cour de cassation', 'Court of Cassation'), 'caselaw/cour-cassation/', fmt(P.cass), L(`${fmt(P.cass_meta)} met de gegevens van Juportal, vooral 2021–2025; de andere, 2025–2026, alleen met de pdf`, `${fmt(P.cass_meta)} avec les données de Juportal, surtout 2021–2025 ; les autres, 2025–2026, avec le seul pdf`, `${fmt(P.cass_meta)} with Juportal’s data, mostly 2021–2025; the others, 2025–2026, with the PDF only`), L('een selectie van de gepubliceerde beslissingen', 'une sélection des décisions publiées', 'a selection of the published decisions')],
    [L('Raad van State', 'Conseil d’État', 'Council of State'), 'caselaw/conseil-etat/', fmt(P.ce), L('juli 1994 – juni 1996', 'juillet 1994 – juin 1996', 'July 1994 – June 1996'), L('vooral gegevens en de officiële link; tekst voor 252 arresten', 'surtout des métadonnées et le lien officiel ; texte pour 252 arrêts', 'mostly metadata and the official link; text for 252 judgments')],
    [L('Andere rechtscolleges', 'Autres juridictions', 'Other courts'), 'caselaw/<COURT>/', fmt(P.caselaw - P.cass - P.ce), L('Antwerpen, Luik en de Raad voor Vreemdelingenbetwistingen', 'Anvers, Liège et le Conseil du contentieux des étrangers', 'Antwerp, Liège and the Council for Alien Law Litigation'), L('niet gebruikt in deze grafieken', 'non utilisées dans ces graphiques', 'not used in these charts')],
    [L('Ontwerpen van het Waals Parlement', 'Projets du Parlement de Wallonie', 'Bills of the Walloon Parliament'), 'drafts/wallonia/', fmt(P.drafts), '2026', L('niet gebruikt in deze grafieken', 'non utilisés dans ces graphiques', 'not used in these charts')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(tr(v))}</code>` : esc(v));
}
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    let room = null;
    if (this.getAttribute('data-fit')) room = +this.getAttribute('data-fit');
    // an end-anchored label ends at its anchor: the room is from there to the svg's left edge, in the svg's own units (it may be scaled)
    else if (this.getAttribute('text-anchor') === 'end' && +this.getAttribute('x') < 0) { const ctm = this.getScreenCTM(); room = (ctm.e + ctm.a * +this.getAttribute('x') - this.ownerSVGElement.getBoundingClientRect().left - 2) / ctm.a; }
    if (room == null || this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tl = t('tiles'), tv = [PF.commits, PF.versions, PF.laws_csv, PF.acts2025, PF.laws2026, PF.caselaw];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.nl, c.fr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dnl, c.dfr, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.nl, c.fr, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(':')[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('be-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('be-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw once more when the web fonts have loaded, so the measures are the fonts' own
if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => { const y = scrollY; render(); scrollTo(0, y); });
</script>

      `Les actes de ce dépôt émanent de huit autorités : l’autorité fédérale (lois), l’Autorité flamande, la Région wallonne, les Communautés française et germanophone et la Commission communautaire française (décrets), la Région de Bruxelles-Capitale et la Commission communautaire commune (ordonnances), ainsi que de leurs gouvernements, collèges et ministres. ${fmt(leg)} actes (${pct(leg, N)}) sont des lois, décrets ou ordonnances, ${fmt(exec)} (${pct(exec, N)}) des arrêtés. Sous les cartes : les actes fédéraux par service public fédéral.`,
      `The acts in this repository come from eight authorities: the federal government (laws), the Flemish government, the Walloon Region, the French and German-speaking Communities and the French Community Commission (decrees), the Brussels-Capital Region and the Common Community Commission (ordinances), and from their governments, colleges and ministers. ${fmt(leg)} acts (${pct(leg, N)}) are laws, decrees or ordinances, ${fmt(exec)} (${pct(exec, N)}) executive decrees (arrêtés). Below the cards: the federal acts by federal public service.`),
    draw(el) {
      legend(el, [{ c: css('--text-2'), l: L('wetgevende akten (wetten, decreten, ordonnanties)', 'actes législatifs (lois, décrets, ordonnances)', 'legislative acts (laws, decrees, ordinances)') },
        { c: css('--text-2') + '80', l: L('besluiten', 'arrêtés', 'executive decrees') }, { c: css('--text-2') + '33', l: L('andere', 'autres', 'other') }]);
      const cards = el.append('div').attr('class', 'ptiles').style('grid-template-columns', `repeat(${narrow(W(el)) ? 2 : 4}, minmax(0, 1fr))`);
      AUTHS.forEach(k => {

        d.append('div').attr('class', 'pv').html(`<b>${fmt(r.n)}</b> ${L(r.n === 1 ? 'akte' : 'akten', r.n === 1 ? 'acte' : 'actes', r.n === 1 ? 'act' : 'acts')} · ${pct(r.n, N)}`);
        d.append('div').attr('class', 'ps').text(`${legN(k, r.leg)} · ${nn(r.exec, ['besluit', 'besluiten'], ['arrêté', 'arrêtés'], ['executive decree', 'executive decrees'])}`);

      });

      h4(el, L('Federale akten per federale overheidsdienst', 'Actes fédéraux par service public fédéral', 'Federal acts by federal public service'), 18);

      const names = [L('Wetten', 'Lois', 'Laws'), L('Koninklijke besluiten', 'Arrêtés royaux', 'Royal decrees'), L('Ministeriële besluiten', 'Arrêtés ministériels', 'Ministerial decrees'),
        L('Andere: reglementen, cao’s, berichten …', 'Autres : règlements, CCT, avis …', 'Other: regulations, collective agreements, notices …')];
      legend(el, names.map((l, i) => ({ c: colors[i], l })));
      const rows = {};
      Object.entries(fb).forEach(([iss, f]) => {

        Object.entries(f).forEach(([form, n]) => { r[['wet', 'kb', 'mb'].includes(form) ? form : 'rest'] += n; });
      });
      const tot = r => r.wet + r.kb + r.mb + r.rest, fedN = by('fed').n;
      const list = Object.values(rows).sort((a, b) => (a.k === 'other') - (b.k === 'other') || tot(b) - tot(a));
      splitBars(el, list, keys, colors, names, { rowH: 24, l: 380, ln: 118, rr: 76, label: (r, nw) => nw ? L(FPS[r.k][3], FPS[r.k][4], FPS[r.k][5]) : L(FPS[r.k][0], FPS[r.k][1], FPS[r.k][2]),
        right: r => `${fmt(tot(r))} · ${pct(tot(r), fedN)}` });

        L(`de overheid is de map waarin Justel de akte rangschikt, de vorm van de akte wordt gelezen uit haar titel (regels in src/prep.py). De repository bevat een selectie uit de lijsten van Justel: ${pct(c.made_q4, N)} van deze akten werd ondertekend in oktober–december 2025, dus de aandelen zijn die van deze selectie, niet van een volledige jaargang. Eén reglement van een orde van advocaten is niet meegeteld.`,
          `l’autorité est le dossier dans lequel Justel classe l’acte, la forme de l’acte est lue dans son intitulé (règles dans src/prep.py). Le dépôt contient une sélection des listes de Justel : ${pct(c.made_q4, N)} de ces actes ont été signés en octobre–décembre 2025 ; les parts sont donc celles de cette sélection, pas d’une année complète. Un règlement d’un ordre des barreaux n’est pas compté.`,
          `the authority is the folder Justel files the act under, the form of the act is read from its title (rules in src/prep.py). The repository holds a selection from Justel’s lists: ${pct(c.made_q4, N)} of these acts were signed in October–December 2025, so the shares are those of this selection, not of a complete year. One regulation of a bar association is left out.`));

      subTable(el, L('Federale akten per dienst', 'Actes fédéraux par service', 'Federal acts by service'), [L('Dienst', 'Service', 'Service'), ...names, t('total')],
        list.map(r => [L(FPS[r.k][0], FPS[r.k][1], FPS[r.k][2]), r.wet, r.kb, r.mb, r.rest, tot(r)]), [0, 1, 1, 1, 1, 1]);
    }
  };
});

      note(el, ['<ACT>/<ISSUER>/2025/<NUMBER>/record.json (made, published)'], fmt(c.n) + L(' akten', ' actes', ' acts'),
        L('de dag van ondertekening en de dag van bekendmaking komen uit het record van Justel. De Duitstalige Gemeenschap en de twee Brusselse gemeenschapscommissies hebben elk minder dan 20 akten in deze selectie; hun mediaan rust op weinig akten.',
          'le jour de la signature et le jour de la publication viennent de la fiche de Justel. La Communauté germanophone et les deux commissions communautaires bruxelloises ont chacune moins de 20 actes dans cette sélection ; leur médiane repose sur peu d’actes.',
          'the day of signature and the day of publication come from Justel’s record. The German-speaking Community and the two Brussels community commissions each have fewer than 20 acts in this selection; their medians rest on few acts.'));
      table(el, [L('Overheid', 'Autorité', 'Authority'), ...names, L('Akten', 'Actes', 'Acts'), L('Mediaan (dagen)', 'Médiane (jours)', 'Median (days)'), L('Middelste helft', 'Moitié centrale', 'Middle half')],
        R.map(r => [an(r.k), r.b0, r.b1, r.b2, r.b3, r.b4, r.n, r.med, `${r.q1}–${r.q3}`]));

const ICL = ['before', 'same', 'd1', 'd10', 'd11', 'later'];
const ICN = () => [L('vóór de bekendmaking', 'avant la publication', 'before publication'), L('op de dag van bekendmaking', 'le jour de la publication', 'on the day of publication'),
  L('1–9 dagen erna', '1 à 9 jours après', '1–9 days after'), L('op de tiende dag', 'le dixième jour', 'on the tenth day'), L('11–31 dagen erna', '11 à 31 jours après', '11–31 days after'), L('later', 'plus tard', 'later')];
const ICS = () => [L('vóór', 'avant', 'before'), L('dag 0', 'jour 0', 'day 0'), '1–9', '10', '11–31', L('later', 'après', 'later')];
const icColors = () => { const c = S8(); return [c[1], c[2], css('--muted-mark'), c[0], css('--muted-mark'), css('--text-3')]; };
chart('c03', el => {
  const c = D.c03, R = c.rows, big = R.filter(r => r.n >= 50);
  const t10 = big.reduce((a, b) => (b.d10 / b.n > a.d10 / a.n ? b : a)), tb = big.reduce((a, b) => (b.before / b.n > a.before / a.n ? b : a));

    title: L(`Inwerkingtreding: de tiende dag na de bekendmaking voor ${pct(t10.d10, t10.n)} van de akten van ${anArt(t10.k)}, terugwerkende kracht voor ${pct(tb.before, tb.n)} van die van ${anArt(tb.k)}`,
      `Entrée en vigueur : le dixième jour après la publication pour ${pct(t10.d10, t10.n)} des actes ${anArt(t10.k)}, effet rétroactif pour ${pct(tb.before, tb.n)} de ceux ${anArt(tb.k)}`,
      `Entry into force: on the tenth day after publication for ${pct(t10.d10, t10.n)} of the acts of ${anArt(t10.k)}, retroactively for ${pct(tb.before, tb.n)} of those of ${anArt(tb.k)}`),
    dek: L(`Hoeveel dagen na de bekendmaking in het Belgisch Staatsblad elke akte van 2025 inging. Een wet die zelf geen dag bepaalt, wordt verbindend op de tiende dag na de bekendmaking (wet van 31 mei 1961, art. 4, zoals REPRODUCE.md aanhaalt). Een akte die ingaat vóór ze verschijnt, werkt terug; ${fmt(c.jan1)} akten traden in werking op 1 januari 2026.`,
      `Le nombre de jours après sa publication au Moniteur belge où chaque acte de 2025 est entré en vigueur. Une loi qui ne fixe pas elle-même de date est obligatoire le dixième jour après sa publication (loi du 31 mai 1961, art. 4, que cite REPRODUCE.md). Un acte qui entre en vigueur avant de paraître rétroagit ; ${fmt(c.jan1)} actes sont entrés en vigueur le 1er janvier 2026.`,
      `How many days after its publication in the Moniteur belge each act of 2025 took effect. A law that sets no day of its own becomes binding on the tenth day after publication (law of 31 May 1961, art. 4, as REPRODUCE.md quotes it). An act that takes effect before it appears is retroactive; ${fmt(c.jan1)} acts took effect on 1 January 2026.`),
    draw(el) {
      const colors = icColors(), names = ICN(), short = ICS();
      legend(el, names.map((l, i) => ({ c: colors[i], l })));

      const panels = AUTHS.map(k => R.find(r => r.k === k)).map(r => {

        p.append('p').text(nn(r.n, ['akte', 'akten'], ['acte', 'actes'], ['act', 'acts']));
        return [p, r];
      });
      panels.forEach(([p, r]) => {
        if ((WR(p) - 4) / 6 * 0.84 < 24) p.select('p').text(p.select('p').text() + ' · %');
        const w = WR(p), h = 118, m = { t: 16, r: 2, b: 18, l: 2 }, svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(ICL).range([0, iw]).padding(0.16), y = d3.scaleLinear().domain([0, 1]).range([ih, 0]);
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        ICL.forEach((k, j) => {
          const v = r[k] / r.n, bx = x(k), bw = x.bandwidth();
          if (r[k]) g.append('path').attr('d', colPath(bx, ih, bw, y(v), 3)).attr('fill', colors[j]);
          const tight = bw < 24;
          g.append('text').attr('class', 'lbl').attr('x', bx + bw / 2).attr('y', y(v) - 4).attr('text-anchor', 'middle').style('font-size', tight ? '8.5px' : '10px').text(r[k] ? (tight ? dec(100 * v, 0) : pv(100 * v)) : '');
          g.append('text').attr('class', 'lbl mut').attr('x', bx + bw / 2).attr('y', ih + 13).attr('text-anchor', 'middle').style('font-size', tight ? '8.5px' : '9.5px').text(tight ? ['<0', '0', '', '10', '', '>31'][j] : short[j]);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', bx).attr('width', bw).attr('y', 0).attr('height', ih).datum(r),
            d => `<b>${esc(an(d.k))}</b>` + trow(colors[j], names[j], `${fmt(d[k])} · ${pct(d[k], d.n)}`) + trow(null, t('total'), fmt(d.n)));

      note(el, ['<ACT>/<ISSUER>/2025/<NUMBER>/record.json (published, in_force)'], fmt(c.n) + L(' akten', ' actes', ' acts'),
        L('de dag van inwerkingtreding is die welke Justel vermeldt; een akte met verschillende dagen voor verschillende artikelen telt met de dag die Justel voor de akte geeft. De drempel van tien dagen geldt voor wetten; dat decreten en ordonnanties dezelfde tiende dag kennen, blijkt hier alleen uit de dagen zelf. Kleine panelen (Duitstalige Gemeenschap, Cocof, GGC) rusten op 11 tot 17 akten.',
          'le jour d’entrée en vigueur est celui qu’indique Justel ; un acte dont les articles entrent en vigueur à des dates différentes compte avec la date que Justel donne pour l’acte. Le délai de dix jours vaut pour les lois ; que les décrets et ordonnances connaissent le même dixième jour ne ressort ici que des jours eux-mêmes. Les petits panneaux (Communauté germanophone, COCOF, COCOM) reposent sur 11 à 17 actes.',
          'the day of entry into force is the one Justel gives; an act whose articles take effect on different days counts with the day Justel gives for the act. The ten-day rule is for laws; that decrees and ordinances share the tenth day shows here only in the days themselves. The small panels (German-speaking Community, COCOF, COCOM) rest on 11 to 17 acts.'));
      table(el, [L('Overheid', 'Autorité', 'Authority'), ...names, t('total')], AUTHS.map(k => R.find(r => r.k === k)).map(r => [an(r.k), ...ICL.map(k => r[k]), r.n]));

chart('c04', el => {
  const P = D.c04.pts, y25 = P.filter(p => p[0] < '2026'), y26 = P.filter(p => p[0] >= '2026');
  const last25 = y25[y25.length - 1], last26 = y26[y26.length - 1];
  // the page reached on a day: the highest start page of an act published that day
  const daily = pts => { const m = new Map(); pts.forEach(p => m.set(p[0], Math.max(m.get(p[0]) || 0, p[1]))); return [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1); };
  const d25 = daily(y25), d26 = daily(y26);
  const doy = s => DAYS(s.slice(0, 4) + '-01-01', s);
  const at25 = day => { const i = d25.findIndex(d => doy(d[0]) >= day); if (i <= 0) return d25[0][1]; const a = d25[i - 1], b = d25[i], f = (day - doy(a[0])) / (doy(b[0]) - doy(a[0])); return a[1] + f * (b[1] - a[1]); };
  const sameX = at25(doy(last26[0])), same = Math.round(sameX / 100) * 100, less = 1 - last26[1] / sameX;
  return {
    title: L(`Het Staatsblad in bladzijden: tot bladzijde ${fmt(last25[1])} in 2025; op ${dayMonth(last26[0])} 2026 telde het ${pct(less, 1)} minder bladzijden dan een jaar eerder`,
      `Le Moniteur en pages : jusqu’à la page ${fmt(last25[1])} en 2025 ; au ${dayMonth(last26[0])} 2026, ${pct(less, 1)} de pages en moins qu’un an plus tôt`,
      `The Moniteur in pages: up to page ${fmt(last25[1])} in 2025; by ${dayMonth(last26[0])} 2026, ${pct(less, 1)} fewer pages than a year earlier`),

      table(el, [L('Verdrag', 'Traité', 'Treaty'), L('Ondertekend', 'Signé', 'Signed'), L('Overheid', 'Autorité', 'Authority'), L('Instemming', 'Assentiment', 'Assent'), L('Jaren', 'Années', 'Years')],

      table(el, [L('Richtlijn', 'Directive', 'Directive'), ...AUTHS.map(k => an(k, true)), t('total'), L('In de akte (Frans)', 'Dans l’acte', 'In the act (French)')], rows.map(r => [r.d, ...AUTHS.map(k => r.by[k] || 0), r.n, r.w.slice(0, 120)]));

part('p2', 'II. Het federale parlement', 'II. Le Parlement fédéral', 'II. The federal Parliament',
  'De federale wetten in deze repository: welke kamers ze behandelen en wat ze regelen, en voor de wetten die de wetboeken wijzigden: wanneer ze werden afgekondigd, hoe snel ze in het Staatsblad verschenen en ingingen, en hoe vaak een wijziging terugwerkt.',

  'The federal laws in this repository: which chambers deal with them and what they do, and for the laws that changed the codes: when they were enacted, how fast they appeared in the Moniteur and took effect, and how often a change is retroactive.');

const my = s => { const [y, m] = s.split('-').map(Number); return `${monthName(m)} ${y}`; };

      `Article 1 of every law says which article of the Constitution governs its procedure: article 74 (the King and the Chamber of Representatives), article 78 (the Senate may examine and amend the bill) or article 77 (Chamber and Senate on an equal footing). ${fmt(n78)} laws fall under article 78, ${fmt(n77)} under article 77, among them the ${fmt(spec)} special laws. The revision of article 195 of 15 July 2026 allows the Chambers formed after 9 June 2024, among other things, to repeal article 74 and to revise article 36 so that the federal legislative power consists of the Chamber of Representatives and the King.`),

        L('de procedure staat in artikel 1 (« La présente loi règle une matière visée à l’article 74 de la Constitution »); de soort wet wordt uit de titel gelezen, de eerste regel die past (regels in src/prep.py); de woorden die alleen de gewijzigde wet noemen, tellen niet. Artikelen: het aantal bepalingen dat Justel voor elke wet geeft. De wetten van 2025 in deze repository dateren van oktober–december 2025.',
          'la procédure figure à l’article 1er (« La présente loi règle une matière visée à l’article 74 de la Constitution ») ; le type de loi est lu dans l’intitulé, première règle applicable (règles dans src/prep.py) ; les mots qui ne font que nommer la loi modifiée ne comptent pas. Articles : le nombre de dispositions que Justel donne pour chaque loi. Les lois de 2025 de ce dépôt datent d’octobre à décembre 2025.',

      `Each row is a year, each square a month: the darker, the more laws changing the codes in this repository were enacted that month. The outlined month is that of the federal elections; in the spring before, laws peak (May 2014: ${fmt(at(2014, 5))}, May 2019: ${fmt(at(2019, 5))}, May 2024: ${fmt(at(2024, 5))}), then a long silence follows. The busiest year is ${peak} (${fmt(tot(peak))}), with ${fmt(at(2014, 1))} laws in January 2014. July and December are busy months too.`),

      `Chaque colonne est une année où une révision est entrée en vigueur, chaque ligne une partie de la Constitution ; le chiffre est le nombre de dispositions que les révisions de l’année ont modifiées ou insérées. Les ${fmt(n140106)} révisions du 6 janvier 2014 ont touché surtout la Chambre et le Sénat (${fmt(cell('ch', '2014'))} dispositions). Une révision du 25 février 2005 a modifié ${fmt(n2005)} dispositions et y a notamment remplacé « Conseil » par « Parlement » pour désigner les conseils des communautés et régions. La révision de l’article 195 en 2026 est la plus récente.`,

    }
  };
});

function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    let room = null;
    if (this.getAttribute('data-fit')) room = +this.getAttribute('data-fit');
    // an end-anchored label ends at its anchor: the room is from there to the svg's left edge, in the svg's own units (it may be scaled)
    else if (this.getAttribute('text-anchor') === 'end' && +this.getAttribute('x') < 0) { const ctm = this.getScreenCTM(); room = (ctm.e + ctm.a * +this.getAttribute('x') - this.ownerSVGElement.getBoundingClientRect().left - 2) / ctm.a; }
    if (room == null || this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tl = t('tiles'), tv = [PF.commits, PF.versions, PF.laws_csv, PF.acts2025, PF.laws2026, PF.caselaw];
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.nl, c.fr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dnl, c.dfr, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.nl, c.fr, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(':')[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('be-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('be-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw once more when the web fonts have loaded, so the measures are the fonts' own
if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => { const y = scrollY; render(); scrollTo(0, y); });
